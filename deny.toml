# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/), checked in CI by
# .github/workflows/ci.yml. Locally: `cargo deny check`.

[graph]
# The shipped binary only targets Linux; Windows- or macOS-only crates never reach it.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
all-features = true

[advisories]
# Every RustSec vulnerability fails; unmaintained and yanked crates fail too, but only for the
# crates we depend on directly or transitively.
unmaintained = "all"
yanked = "deny"
ignore = [
    # unsafe-libyaml (through serde_yaml) is unmaintained, with no known vulnerability. It only
    # parses front matter from the user's own configuration repository. Replace serde_yaml with a
    # maintained parser, then drop this entry.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained only; parses trusted local front matter" },
]

[licenses]
# Permissive licences compatible with shipping an MIT binary. A new licence in the tree fails the
# check until it is reviewed and added here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"
confidence-threshold = 0.9

[bans]
# Duplicate versions are reported without failing. Wildcard version requirements are refused
# outright, except our own path crates.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
