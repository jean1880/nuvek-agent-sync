# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: Bug report
description: agent-sync renders, checks or applies something the wrong way.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A bug that can be reproduced gets fixed first.

        **A security problem?** Don't file it here. Use [private vulnerability reporting](https://github.com/jean1880/nuvek-agent-sync/security/advisories/new) (see [SECURITY.md](https://github.com/jean1880/nuvek-agent-sync/blob/master/SECURITY.md)).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the [open and closed issues](https://github.com/jean1880/nuvek-agent-sync/issues?q=is%3Aissue) and found no report of this.
          required: true
        - label: I removed API keys, tokens, hostnames, home paths and anything else private from what I paste below.
          required: true

  - type: dropdown
    id: command
    attributes:
      label: Command
      multiple: true
      options:
        - check
        - apply
        - status
        - import
        - promote
        - validate
        - selftest
        - session
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Affected tool
      multiple: true
      options:
        - Claude Code
        - Antigravity
        - Codex
        - None (agent-sync itself)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the `agent-sync check --verbose` output and the exit code.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal source
      description: The smallest `sync/` file (or overlay) that shows the problem.
      render: toml

  - type: input
    id: version
    attributes:
      label: Version
      description: "`agent-sync --version`, or the tag or commit you built."
      placeholder: "v1.0.0"
    validations:
      required: true
