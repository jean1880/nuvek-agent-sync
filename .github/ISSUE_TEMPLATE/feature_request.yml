# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: Feature request
description: Suggest a new projection, source format or behaviour.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Start from the problem: what you're trying to do, and what gets in the way.

        agent-sync names no host or deployment. A value that differs between machines belongs in your source checkout, your overlay or your environment, not in agent-sync.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the [open and closed issues](https://github.com/jean1880/nuvek-agent-sync/issues?q=is%3Aissue) and found no request for this.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what makes it hard today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How you picture the source format or the behaviour.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered

  - type: dropdown
    id: contribute
    attributes:
      label: Would you work on it?
      options:
        - "Yes, I'd like to open a pull request"
        - Maybe, with some guidance
        - "No"
